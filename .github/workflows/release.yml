name: Release

# Every push to linux-port, master, or Neon whose project files carry a version that has
# no GitHub release yet builds iBiblia for Windows (x64) and Linux (x86_64) with
# Lazarus and publishes release v<version>. The programs check this release feed
# at start-up and update themselves (see app_updater.pas).

on:
  push:
    branches: [linux-port, master, Neon]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      needed: ${{ steps.ver.outputs.needed }}
      linux: ${{ steps.ver.outputs.linux }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether this version needs a release
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 scripts/ci_check_version.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists - nothing to do."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -f iBiblia-linux.lpi ]; then echo "linux=true" >> "$GITHUB_OUTPUT"; else echo "linux=false" >> "$GITHUB_OUTPUT"; fi

  windows:
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gcarreno/setup-lazarus@v3
        with:
          lazarus-version: stable
          with-cache: false
      - name: Lazarus packages
        shell: bash
        run: |
          git clone --depth 1 https://github.com/kryslt/KControls.git "$RUNNER_TEMP/KControls"
          git clone --depth 1 https://github.com/skalogryz/richmemo.git "$RUNNER_TEMP/richmemo"
          git clone --depth 1 https://github.com/serbod/lazrichview.git "$RUNNER_TEMP/lazrichview"
          lazbuild --add-package-link "$RUNNER_TEMP/KControls/packages/lazarus/kcontrolsbase.lpk"
          lazbuild --add-package-link "$RUNNER_TEMP/KControls/packages/lazarus/kcontrolslaz.lpk"
          lazbuild --add-package-link "$RUNNER_TEMP/richmemo/richmemopackage.lpk"
          RV=$(find "$RUNNER_TEMP/lazrichview" -iname 'lazrichview.lpk' | head -1)
          echo "lazrichview package: $RV"
          lazbuild --add-package-link "$RV"
      - name: Build
        shell: bash
        run: |
          lazbuild --os=win64 --cpu=x86_64 --ws=win32 --build-mode=Release iBiblia.lpi
          ls -la iBiblia.exe
      - name: Package
        shell: bash
        run: python scripts/ci_package.py windows "${{ needs.plan.outputs.version }}" . dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  linux:
    needs: plan
    if: needs.plan.outputs.needed == 'true' && needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk2.0-dev libpcre3 libsqlite3-dev
      - uses: gcarreno/setup-lazarus@v3
        with:
          lazarus-version: stable
          with-cache: false
      - name: Lazarus packages
        run: |
          git clone --depth 1 https://github.com/kryslt/KControls.git "$RUNNER_TEMP/KControls"
          git clone --depth 1 https://github.com/skalogryz/richmemo.git "$RUNNER_TEMP/richmemo"
          lazbuild --add-package-link "$RUNNER_TEMP/KControls/packages/lazarus/kcontrolsbase.lpk"
          lazbuild --add-package-link "$RUNNER_TEMP/KControls/packages/lazarus/kcontrolslaz.lpk"
          lazbuild --add-package-link "$RUNNER_TEMP/richmemo/richmemopackage.lpk"
      - name: Build
        run: |
          lazbuild --ws=gtk2 --build-mode="Release Linux" iBiblia-linux.lpi
          ls -la iBiblia
      - name: Package
        run: |
          python3 scripts/ci_package.py linux "${{ needs.plan.outputs.version }}" . dist \
            --libpcre /lib/x86_64-linux-gnu/libpcre.so.3
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.zip

  publish:
    needs: [plan, windows, linux]
    if: ${{ !cancelled() && needs.plan.outputs.needed == 'true' && needs.windows.result == 'success' && (needs.linux.result == 'success' || needs.plan.outputs.linux == 'false') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          cd dist && sha256sum iBiblia-*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt && cd ..
          python3 scripts/ci_release_notes.py "$VERSION" > notes.md
          TAG="v$VERSION"
          TITLE="iBiblia — 64-Bit Edition (v$VERSION)"
          gh release delete neon --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" dist/iBiblia-*.zip dist/SHA256SUMS.txt \
            --title "$TITLE" --notes-file notes.md --latest --target "$GITHUB_SHA"
